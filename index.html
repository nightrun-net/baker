<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>Baker Coiffeur</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  height: 100dvh; 
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
  touch-action: none; 
}

.video-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none; 
}

video::-webkit-media-controls,
video::-webkit-media-controls-start-playback-button {
  display: none !important;
  -webkit-appearance: none;
}

.video-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.85));
  z-index: 1;
}

/* ===== DROPDOWN YA ZIMANAN ===== */
.lang-dropdown {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 100;
}

.drop-btn {
  background: rgba(0, 0, 0, 0.5);
  color: #d3ac67; 
  padding: 10px 18px;
  border-radius: 25px;
  border: 1px solid #d3ac67; 
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  backdrop-filter: blur(8px);
  transition: 0.3s ease;
}

.drop-btn i {
  font-size: 18px;
  color: #d3ac67; 
}

.drop-btn:hover {
  background: #d3ac67;
  color: #000;
}

.drop-btn:hover i {
  color: #000;
}

.lang-menu {
  position: absolute;
  top: 50px;
  right: 0;
  background: rgba(0, 0, 0, 0.85); 
  border-radius: 15px;
  display: none;
  flex-direction: column;
  min-width: 130px;
  border: 1px solid #d3ac67; 
  backdrop-filter: blur(15px);
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(211, 172, 103, 0.2);
}

.lang-menu.show {
  display: flex;
}

.lang-menu button {
  background: transparent;
  color: white;
  border: none;
  padding: 12px 16px;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}

.lang-menu button:hover {
  background: rgba(211, 172, 103, 0.15); 
  color: #d3ac67; 
}

/* ===== LOGO ===== */
.logo {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  text-align: center;
  z-index: 2;
  pointer-events: none;
}

.logo img {
  width: 250px; 
  max-width: 80%;
  filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));
}

/* ===== BIŞKOKA XWARÊ (Welcome) ===== */
.bottom-button {
  position: absolute;
  bottom: 80px; 
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 60px;
  background: #d3ac67; 
  color: #000; 
  text-decoration: none;
  border-radius: 50px; 
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
  backdrop-filter: blur(6px);
  transition: 0.3s;
  z-index: 2;
  text-align: center;
  min-width: 120px;
  box-shadow: 0 4px 15px rgba(211, 172, 103, 0.4);
}

.bottom-button:hover {
  background: #e5be7a;
  transform: translateX(-50%) scale(1.05);
}

@media screen and (max-width: 768px) {
  .logo img {
    width: 200px; 
  }
  .bottom-button {
    bottom: 60px; 
    padding: 12px 50px;
    font-size: 16px;
  }
  .drop-btn {
    padding: 8px 15px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="video-container">

  <!-- Hilbijartina Ziman -->
  <div class="lang-dropdown">
    <button class="drop-btn" onclick="toggleLangMenu()">
     <i class="fa-solid fa-earth-americas"></i>
      <span id="active-lang-name">English</span>
    </button>
    <div class="lang-menu" id="langMenu">
      <button onclick="selectLang('de')">Deutsch</button>
      <button onclick="selectLang('fr')">Français</button>
      <button onclick="selectLang('it')">Italiano</button>
      <button onclick="selectLang('en')">English</button>
    </div>
  </div>

  <div class="logo">
    <img src="bi.png" alt="Logo" />
  </div>

  <video id="bg-video" autoplay muted loop playsinline webkit-playsinline disablePictureInPicture>
    <source src="vi.mp4" type="video/mp4" />
  </video>

  <div class="video-gradient"></div>

  <!-- Bişkoka Sereke -->
  <a href="baber/Barber.html" class="bottom-button" id="main-btn">
    Welcome
  </a>

</div>

<script>
const textData = {
    'en': { name: 'English', welcome: 'Welcome' },
    'de': { name: 'Deutsch', welcome: 'Willkommen' },
    'fr': { name: 'Français', welcome: 'Bienvenue' },
    'it': { name: 'Italiano', welcome: 'Benvenuto' }
};

function toggleLangMenu() {
    document.getElementById("langMenu").classList.toggle("show");
}

function selectLang(lang) {
    document.getElementById("active-lang-name").innerText = textData[lang].name;
    document.getElementById("main-btn").innerText = textData[lang].welcome;
    document.getElementById("langMenu").classList.remove("show");
    
    // Save Language in Local Storage
    localStorage.setItem('bakerLang', lang);
}

// Check Local Storage on Load
document.addEventListener('DOMContentLoaded', () => {
    let savedLang = localStorage.getItem('bakerLang') || 'de'; // Default is 'de'
    selectLang(savedLang);
});

// Close menu on outside click
window.onclick = function(event) {
    if (!event.target.closest('.lang-dropdown')) {
        const menu = document.getElementById("langMenu");
        if (menu.classList.contains('show')) {
            menu.classList.remove('show');
        }
    }
};

document.addEventListener("DOMContentLoaded", function() {
    let video = document.getElementById("bg-video");
    video.muted = true;
    video.play().catch((err) => { console.log(err); });

    document.body.addEventListener('touchstart', function() {
        video.muted = true;
        video.play();
    }, { once: true });
});
</script>

</body>
</html>
